# Nixpacks renders this template immediately before starting Nginx.  It is
# based on Nixpacks' PHP/Laravel template, with deliberate upload limits for
# Filament and Livewire added below.  Without `client_max_body_size`, Nginx
# defaults to 1 MB and rejects a browser upload before Laravel can report it.
worker_processes 5;
daemon off;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
}

http {
    include $!{nginx}/conf/mime.types;

    index index.html index.htm index.php;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] $status '
                    '"$request" $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout;
    error_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    server_names_hash_bucket_size 128;

    # Supports the app's largest Filament field (a 10 MB voucher) plus
    # multipart overhead.  Individual fields still enforce their own limits.
    client_max_body_size 16M;
    client_body_timeout 120s;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        $if(NIXPACKS_PHP_ROOT_DIR) (
            root ${NIXPACKS_PHP_ROOT_DIR};
        ) else (
            root /app;
        )

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        index index.php;
        charset utf-8;

        # Nixpacks always detects this repo as Laravel (IS_LARAVEL is always
        # "yes"), so the non-Laravel fallback-path branch is unreachable here
        # and is omitted entirely rather than conditioned. Do NOT reintroduce
        # a conditional for this block, nested or as two independent blocks:
        # Nixpacks' renderer (scripts/config/template.mjs) resolves its
        # if-directive with a single-pass, NON-GREEDY regex that cannot parse
        # nested parentheses -- nesting one conditional inside another's
        # negative branch leaves stray unmatched parenthesis text in the
        # rendered nginx.conf, and two independent top-level blocks both
        # render at once (duplicate root location). Either mistake crashes
        # nginx immediately on container start. Verified by literally
        # re-implementing Nixpacks' render algorithm in
        # tests/Feature/LivewireTemporaryUploadConfigurationTest.php.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        location = /robots.txt {
            access_log off;
            log_not_found off;
        }

        $if(IS_LARAVEL) (
            error_page 404 /index.php;
        ) else ()

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;

            # PHP-FPM defaults can be smaller than Filament's 2 MB image and
            # 10 MB voucher field limits. These directives are PHP_INI_PERDIR
            # values, applied only to requests served by this application.
            fastcgi_param PHP_VALUE "upload_max_filesize=12M\npost_max_size=16M\nmax_execution_time=120\nmax_input_time=120";
            fastcgi_read_timeout 120s;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
