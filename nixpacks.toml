[variables]
NIXPACKS_NODE_VERSION = "22"
NIXPACKS_PHP_ROOT_DIR = "/app/public"
NIXPACKS_PHP_FALLBACK_PATH = "/index.php"

# `php artisan deploy:migrate` (see App\Console\Commands\DeployMigrate) is
# run automatically via Coolify's own "Post-deployment Command" setting for
# this application (Configuration -> Advanced), NOT from a [start] override
# here -- an earlier attempt to chain it into [start] hardcoded
# `heroku-php-apache2` as the web-server command, which doesn't exist on
# this Coolify/Nixpacks setup and broke the container's healthcheck (see
# CHANGELOG.md). Coolify's post-deployment command runs inside the new
# container after it's already confirmed healthy, so it never needs to know
# or guess how the app server itself is started.
