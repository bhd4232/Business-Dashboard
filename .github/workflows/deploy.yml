name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, filter, gd, iconv, intl, mbstring, pdo_sqlite, sqlite3, xml, xmlreader, xmlwriter, zip
          coverage: none

      - name: Install PHP dependencies for tests
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Discover Laravel packages
        run: php artisan package:discover --ansi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test deployment metadata
        run: npm run test:deployment-metadata

      - name: Test app updater
        run: npm run test:app-updater

      - name: Test native push integration
        run: npm run test:push-notifications

      - name: Test web push integration
        run: npm run test:web-push

      - name: Build frontend assets
        run: npm run build

      - name: Run tests
        run: |
          php artisan test

  cut-release:
    name: Cut release from CHANGELOG.md
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan package:discover --ansi

      # Converts CHANGELOG.md's [Unreleased] section (if it has any bullet
      # content) into a new dated, versioned release entry, and syncs
      # config/release.php + .env.example + .env.production.example +
      # docs/deployment.md to match. See app/Support/ReleaseCutter.php.
      - name: Cut release
        id: cut
        run: |
          OUTPUT="$(php artisan release:cut --apply)"
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "changed=true"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(echo "$OUTPUT" | grep -oP 'version=\K.*')" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Commit message includes [skip ci] so this bot commit doesn't
      # re-trigger this same workflow — the next run would find [Unreleased]
      # already empty and no-op anyway, but this avoids the wasted CI run.
      - name: Commit and push version bump
        if: steps.cut.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md config/release.php .env.example .env.production.example docs/deployment.md
          git commit -m "chore(release): cut v${{ steps.cut.outputs.version }} [skip ci]"
          git push origin HEAD:main

  build-android:
    runs-on: ubuntu-latest
    needs: tests
    env:
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install npm dependencies
        run: npm ci

      - name: Configure Firebase Android
        if: env.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 != ''
        run: |
          printf '%s' "${FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64}" \
            | base64 --decode \
            > android/app/google-services.json

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: business-dashboard-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
